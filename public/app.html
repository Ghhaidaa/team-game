<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>مسابقة الفرق</title>
<link href="https://fonts.googleapis.com/css2?family=Readex+Pro:wght@500;700&family=Tajawal:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/common.css"><style>
.top{display:flex;justify-content:space-between;align-items:center;padding:14px 28px;background:linear-gradient(165deg,#9E5AFF,#25144A);color:#fff}.top h1{font-size:2em}.top span{color:var(--y)}
.lobby{display:grid;grid-template-columns:minmax(300px,440px) 1fr;gap:28px;padding:28px;max-width:1300px;margin:auto}@media(max-width:850px){.lobby{grid-template-columns:1fr}}
.qrcard{text-align:center;background:var(--cd);border-radius:32px;padding:24px;box-shadow:0 4px 0 rgba(37,20,74,.15);align-self:start}
.qrframe{background:#fff;border-radius:28px;padding:10px;border:10px solid var(--p);box-shadow:0 0 0 6px var(--y);animation:ring 2.4s infinite}.qrframe svg{display:block;width:100%;height:auto}@keyframes ring{50%{box-shadow:0 0 0 14px #FFCA3A66}}
.code{font:700 3.4em/1.2 'Readex Pro',sans-serif;letter-spacing:.15em;margin-top:12px;direction:ltr;color:var(--p)}.qrcard small{word-break:break-all}#warn{color:#c0334d;margin-top:8px;font-size:.9em}
.tms{display:grid;grid-template-columns:1fr 1fr;gap:20px;align-content:start}.tms>div{border-radius:28px;padding:20px;min-height:260px}.tms h2{font-size:1.5em}.tms ul{list-style:none;padding:0;margin:12px 0 0}
.tms li{background:#ffffff33;border-radius:14px;padding:6px 12px;margin:8px 0;font:700 1.15em Tajawal;display:flex;gap:6px;align-items:center;flex-wrap:wrap}.tms li em{flex:1;font-style:normal}.tms li button{border:0;border-radius:8px;cursor:pointer;padding:2px 8px}.tms .add{display:flex;gap:4px}.tms .add input{margin:0;flex:1;width:auto;min-width:0}
.host{position:sticky;bottom:0;display:flex;gap:6px;flex-wrap:wrap;align-items:center;justify-content:center;padding:10px;background:var(--ink);color:#fff;border-top:4px solid var(--y);z-index:5}.host>span{color:var(--y);font-weight:700}.host input{width:160px;padding:6px;margin:0}
body.aud .host{display:none}.audb{position:fixed;bottom:12px;left:12px;opacity:.3;padding:8px 14px;z-index:6;display:none}.audb:hover{opacity:1}body.aud .audb{display:inline-block}
.hd{display:flex;gap:12px;padding:12px 16px;background:var(--ink);color:#fff}.sc{flex:1;border-radius:16px;padding:6px 18px;display:flex;justify-content:space-between;align-items:center}.sc b{font-size:2.6em;line-height:1.2}.sc b.bump{animation:pp .5s}.rn{align-self:center;text-align:center;font-weight:700;min-width:22%}.rn small{display:block;font-weight:400;color:var(--y)}
.bn{border-radius:24px;padding:18px;margin:14px 0}.chips{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}.chip{padding:8px 16px;border-radius:14px;border:3px solid transparent;font:700 1em Tajawal;cursor:pointer;background:var(--bg);color:var(--tx)}.chip.on{border-color:var(--y);background:var(--ink);color:#fff}
.big{font-size:clamp(60px,10vw,140px);font-family:'Readex Pro',sans-serif;font-weight:700;line-height:1}.hint{font-size:.8em;opacity:.7}
.win{animation:pp .8s}.trophy{font-size:6em;animation:bob 1.4s infinite alternate}@keyframes bob{to{transform:translateY(-14px) rotate(4deg)}}
</style></head><body><div id="app"></div><button class="b audb" data-a=aud>⚙ الأدوات</button><div id="toast" hidden></div>
<script src="/qrcode.js"></script>
<script>
const $=s=>document.querySelector(s),E=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])),AR=n=>String(n).replace(/\d/g,d=>'٠١٢٣٤٥٦٧٨٩'[d]);
const M=location.pathname.startsWith('/s/')?'s':'h',HO=M==='h';let C,K,st=null,off=0,es,bad=0,cf=0,seen=new Set(),pts=[10,20,40];
const RN=['سبوركل','تحدي الثلاثين','خمن العبارة'];
const INTRO=['يجيب كل لاعب سراً عن السؤال نفسه. يكسب الفريق التحدي إذا كانت إجاباته الثلاث صحيحة ومختلفة. الأكثر فوزاً بالتحديات الثلاثة يفوز بالجولة.','ثلاث مواجهات: لاعب من كل فريق يزايد على عدد الإجابات حتى ينسحب أحدهما. صاحب أعلى مزايدة يجيب خلال ٣٠ ثانية.','خمسة ألغاز بصرية، ٣٠ ثانية لكل لغز. أول فريق يضغط الجرس يجيب، والخطأ ينقل الفرصة للفريق الآخر.'];
const post=(u,b)=>fetch(u,{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify(b)}).then(r=>r.json()).catch(()=>({e:'تعذر الاتصال بالخادم'}));
function toast(m){const e=$('#toast');e.textContent=m;e.hidden=false;clearTimeout(toast.t);toast.t=setTimeout(()=>e.hidden=true,2600)}
const A=(a,x)=>post('/api/host',{c:C,k:K,a,...x}).then(r=>{if(r.e)toast(r.e);return r});
const nm=t=>E(st.names[t]),P=id=>st.players.find(p=>p.id===id)||{name:'؟',manual:1},tg=t=>`<span class="tag c${t}">${nm(t)}</span>`;
function paint(h){const a=document.activeElement,vals={};document.querySelectorAll('#app input[id],#app select[id]').forEach(e=>vals[e.id]=e.value);const aid=a&&a.id,ss=a&&a.selectionStart;
 $('#app').innerHTML=h;for(const id in vals){const e=document.getElementById(id);if(e)e.value=vals[id]}
 if(aid){const e=document.getElementById(aid);if(e){e.focus();try{e.setSelectionRange(ss,ss)}catch(_){}}}}
// ---- session
async function create(){const r=await post('/api/create',{});if(r.e)return toast(r.e);C=r.c;K=r.k;localStorage.hr=JSON.stringify(r);connect()}
async function init(){if(!HO){C=location.pathname.split('/')[2];return connect()}
 try{({c:C,k:K}=JSON.parse(localStorage.hr))}catch(e){}if(C){const r=await fetch('/api/info?c='+C).catch(()=>null);if(r&&r.status===200)return connect()}C=K=null;home()}
function connect(){if(es)es.close();es=new EventSource(`/api/events?c=${C}&role=${HO?'host&k='+K:'screen'}`);
 es.onmessage=e=>{bad=0;document.body.classList.remove('off');st=JSON.parse(e.data);off=st.now-Date.now();render()};
 es.onerror=async()=>{document.body.classList.add('off');if(++bad>2){const r=await fetch('/api/info?c='+C).catch(()=>null);if(r&&r.status===404){es.close();if(HO){localStorage.removeItem('hr');home()}else paint('<div class=stage><div class=q>انتهت الجلسة</div></div>')}}}}
// ---- views
function home(){const rc=['var(--t)','var(--y)','var(--p)'];paint(`<section class=hero><div class=pill>فعالية تنافسية · فريقان · ٣ جولات</div><h1>مسابقة <span>الفرق</span></h1><p>اختاروا لاعبيكم، اجمعوا النقاط، وخلّوا الفوز لأذكى فريق.</p><button class="b big" data-a=create>ابدأ اللعبة</button> <a class=b href="#how">كيف تلعب؟</a></section><div class=tabs>${RN.map((n,i)=>`<span style="background:${rc[i]};color:${i==2?'#fff':'var(--ink)'}">${n}</span>`).join('')}</div><main class=stage><h2>شرح الجولات</h2><div class=row3>${RN.map((n,i)=>`<div class="cd rc" style="border-top:6px solid ${rc[i]}"><i style="background:${rc[i]}">${AR(i+1)}</i><h2>${n}</h2><small>${AR(pts[i])} نقطة</small><p>${INTRO[i]}</p></div>`).join('')}</div><h2 id=how>كيف تلعبون؟</h2><div class=row3>${['امسحوا الرمز بجوالكم أو أضافكم المقدم يدوياً','اختاروا ٣ لاعبين لكل جولة','تنافسوا واجمعوا النقاط'].map((t,i)=>`<div class=st><i>${AR(i+1)}</i><p>${t}</p></div>`).join('')}</div><div class=cta><h2>جاهزين للتحدي؟</h2><button class="b t big" data-a=create>ابدأوا الآن</button></div></main>`)}
let qrc={};function genQR(u){if(qrc[u])return qrc[u];try{const q=qrcode(0,'M');q.addData(u);q.make();const n=q.getModuleCount(),z=3;let d='';for(let r=0;r<n;r++)for(let c=0;c<n;c++)if(q.isDark(r,c))d+=`M${c+z},${r+z}h1v1h-1z`;return qrc[u]=`<svg viewBox="0 0 ${n+2*z} ${n+2*z}" shape-rendering="crispEdges" role="img" aria-label="QR"><rect width="100%" height="100%" fill="#fff"/><path d="${d}" fill="#25144A"/></svg>`}catch(e){return'<p>تعذر توليد الرمز</p>'}}
function lobby(){const u=location.origin+'/j/'+C,loc=/^(localhost|127\.|0\.0\.0\.0|\[::1\]|192\.168\.|10\.)/.test(location.hostname);
 const roster=t=>{const l=st.players.filter(p=>p.team===t);return`<div class="c${t}"><h2>${nm(t)} (${AR(l.length)})</h2><ul>${l.map(p=>{const n=!seen.has(p.id);seen.add(p.id);return`<li class="${n?'pop':''}"><em>${E(p.name)}</em><span title="${p.manual?'أضافه المقدم (بلا جوال)':'متصل بجواله'}">${p.manual?'✋':p.on?'📱':'📵'}</span>${HO?`<button data-a=rename data-v=${p.id}>✎</button><button data-a=move data-v="${p.id}:${1-t}">⇄</button><button data-a=kick data-v=${p.id}>✕</button>`:''}</li>`}).join('')||'<li style="opacity:.7">بانتظار اللاعبين…</li>'}</ul>${HO?`<div class=add><input id=nn${t} placeholder="إضافة لاعب بلا جوال" maxlength=20><button class="b sm" data-a=add data-v=${t}>إضافة</button></div>`:''}</div>`};
 const n0=st.players.filter(p=>p.team===0).length,n1=st.players.length-n0;
 return`<header class=top><h1>مسابقة <span>الفرق</span></h1>${HO?`<a class=b href="/s/${C}" target=_blank rel=noopener>افتح شاشة العرض</a>`:''}</header><main class=lobby><section class=qrcard><div class=qrframe>${genQR(u)}</div><div class=code>${C}</div><p>امسحوا الرمز بكاميرا الجوال للانضمام</p><small dir=ltr>${u}</small>${loc?'<div id=warn>تنبيه: العنوان محلي، فلن تفتحه إلا الجوالات على الشبكة نفسها. انشروا الخادم ليظهر رمز بعنوان عام.</div>':''}</section><section class=tms>${roster(0)}${roster(1)}</section></main>`+(HO?`<footer class=host><span>المقدم</span><input id=t0 value="${E(st.names[0])}" data-ch=names><input id=t1 value="${E(st.names[1])}" data-ch=names><button class=b data-a=start>ابدأ المنافسة (${AR(n0)} / ${AR(n1)})</button></footer>`:'')}
function intro(){const ri=st.ri;let sel='';if(ri<2)sel=`<div class=row>${[0,1].map(t=>`<div class=cd><h2>${tg(t)}</h2><p><small>${ri?'ترتيب الاختيار = ترتيب المواجهات':'اختاروا ٣ لاعبين'}</small></p><div class=chips>${st.players.filter(p=>p.team===t).map(p=>{const i=st.sel[ri][t].indexOf(p.id);return HO?`<button class="chip ${i>=0?'on':''}" data-a=pick data-v="${t}:${p.id}">${i>=0&&ri?AR(i+1)+'. ':''}${E(p.name)}</button>`:`<span class="chip ${i>=0?'on':''}">${E(p.name)}</span>`}).join('')}</div></div>`).join('')}</div>`;
 return`<main class=stage><div class="cd pop"><h2>الجولة ${AR(ri+1)}</h2><div class=q>${RN[ri]}</div><p><b>${AR(st.pts[ri])}</b> نقطة للفائز</p><p>${INTRO[ri]}</p>${ri==2?'<p>يشارك الفريق كله ويتشاورون، والجرس على جوال كل لاعب.</p>':''}</div>${sel}</main>`}
function tmh(T){return T?`<div class=tm><b id=tn></b><div class=tl><span id=tbar></span></div></div>`:''}
function k1(){const g=st.g;let h=`<small>التحدي ${g.i<3?AR(g.i+1)+' من ٣':'الفاصل'} · ${g.lv} · الفوز: ${AR(g.wins[0])} - ${AR(g.wins[1])}</small><div class=cd><div class=q>${E(g.q)}</div></div>`;
 if(g.ph==='in')return h+`<div class=row>${[0,1].map(t=>`<div class=cd><h2>${tg(t)}</h2>${st.sel[0][t].map(id=>{const p=P(id),d=g.subs.includes(id);return`<div class="ch ${d?'ok':'dup'}">${E(p.name)} ${p.manual?'✋':'📱'} ${d?'✓ أرسل':'… بانتظار الإجابة'}${HO&&!d?`<br><input id=a_${id} class=mask placeholder="إجابته نيابةً عنه" autocomplete=off> <button class="b p sm" data-a=ans data-v=${id}>أرسل</button>`:''}</div>`}).join('')}</div>`).join('')}</div>`;
 if(!g.eval)return h+`<div class=cd><div class=q>٦ إجابات جاهزة</div><p>تظهر بعد أن يضغط المقدم «اكشف».</p></div>`;
 return h+`${HO&&g.ph==='rev'&&!g.show?'<p class=hint>للمقدم: الجمهور لا يرى الإجابات بعد. اضغط إجابة لتغيير الحكم عليها.</p>':''}<div class=row>${g.eval.map((e,t)=>`<div class=cd><h2>${tg(t)}</h2>${e.it.map(x=>{const c=x.dup?'dup':x.ok?'ok':'no',lab=`<span class=tx>${E(x.text||'—')}</span> ${x.dup?'(مكررة)':x.ok?'✓':'✗'}<br><small>${E(x.name)}</small>`;return HO&&g.ph==='rev'?`<button class="ch ${c}" data-a=ov data-v=${x.pid}>${lab}</button>`:`<div class="ch ${c}">${lab}</div>`}).join('')}<p class=q>${e.pass?'✓ نجح':'✗ لم ينجح'}</p></div>`).join('')}</div>`}
function k2(){const g=st.g,m=g.mp,pn=t=>m[t]?E(m[t].name)+(m[t].manual?' ✋':' 📱'):'؟';
 let h=`<small>المواجهة ${AR(g.i+1)} من ٣ · الفوز: ${AR(g.w[0])} - ${AR(g.w[1])}</small><div class=row>${[0,1].map(t=>`<div class="cd c${t}" style="margin:6px 0"><b>${pn(t)}</b><br><small>${nm(t)}</small></div>`).join('')}</div><div class=cd><div class=q>${E(g.q)}</div></div>`;
 if(g.ph==='bid')return h+`<div class="cd"><h2>مرحلة المزايدة</h2><div class=big>${g.bid?AR(g.bid):'—'}</div>${g.bt!=null?`<p>أعلى مزايدة: ${tg(g.bt)}</p>`:'<p>كم إجابة تستطيع؟</p>'}${HO?`<div class=row>${[0,1].map(t=>`<div><input id=bv${t} type=number min=1 max=30 inputmode=numeric placeholder="${nm(t)}"><br><button class="b ${t?'t':'p'} sm" data-a=bid data-v=${t}>زايد</button>${g.bt!=null&&g.bt!==t?`<button class="b r sm" data-a=wd data-v=${t}>انسحاب</button>`:''}</div>`).join('')}</div><p class=hint>اللاعبون بجوالاتهم يزايدون بأنفسهم، والمقدم يسجّل نيابةً عمن بلا جوال.</p>`:''}</div>`;
 if(g.ph==='ans')return h+`<div class=cd><h2>مرحلة الإجابة</h2><p>${tg(g.at)} ${pn(g.at)} يجيب · المطلوب <b>${AR(g.bid)}</b> · الصحيح <b>${AR(g.ans.filter(x=>x.s==='ok').length)}</b></p>${g.T.run||g.T.left<30000?tmh(g.T):'<p>بانتظار بدء الوقت…</p>'}${g.exp?'<div class=q>انتهت المحاولة</div>':HO?`<input id=ai autocomplete=off placeholder="إجابة نيابةً عن اللاعب، ثم Enter"> <button class="b p sm" data-a=add2>أضف</button>`:''}${g.ans.map((x,i)=>`<div class="ch ${x.s==='ok'?'ok':x.s==='p'?'dup':'no'}">${E(x.a)} ${x.s==='ok'?'✓':x.s==='d'?'(مكررة)':x.s==='x'?'✗':HO?`<button class="b t sm" data-a=pv data-v=${i}:1>صحيحة</button><button class="b r sm" data-a=pv data-v=${i}:0>خاطئة</button>`:'… بانتظار الحكم'}</div>`).join('')}</div>`;
 return h+`<div class="cd pop"><div class=q>${g.sx?'نجح التحدي ✓':'لم ينجح التحدي ✗'}</div><p>فاز بالمواجهة ${tg(g.sx?g.at:1-g.at)}</p></div>`}
function k3(){const g=st.g,n=g.mode==='reg'?AR(g.i+1)+' من ٥':'فاصل';
 if(g.ph==='ready')return`<div class="cd pop"><div class=q>${g.mode==='final'?'لغز الحسم':'اللغز '+n}</div><p>الفريقان جاهزان؟ الجرس على كل جوال.</p></div>`;
 let h=`<small>اللغز ${n} · الألغاز: ${AR(g.sc[0])} - ${AR(g.sc[1])}</small><div class=cd>${g.puz}</div>${g.ph==='run'?tmh(g.T):''}`;
 if(g.ph==='run'&&HO)h+=`<div class=cd><b>تسجيل ضغطة نيابةً</b> <small>(يدوية: لا تحمل دقة توقيت ضغطة الجوال)</small><div class=row>${[0,1].map(t=>`<div><select id=hb${t}>${st.players.filter(p=>p.team===t).map(p=>`<option value=${p.id}>${E(p.name)}${p.manual?' ✋':''}</option>`).join('')}</select><button class="b ${t?'t':'p'} sm" data-a=hbuzz data-v=${t}>🔔 ${nm(t)}</button></div>`).join('')}</div></div>`;
 if(g.ph==='buzz')h+=`<div class="bn pop c${g.bz}"><div class=q>🔔 ${nm(g.bz)}${g.by?' ('+E(g.by)+')':''}</div><p>${g.bm?'سجّلها المقدم يدوياً':'ضغطة مباشرة من الجوال'} · بانتظار الإجابة</p></div>`;
 if(g.ph==='end')h+=`<div class=cd><div class=q>${E(g.answer)}</div><p>${g.who!==null?'النقطة لـ'+tg(g.who):'انتهى اللغز دون نقاط'}</p></div>`;
 return h}
function final(){const w=st.fw!=null?st.fw:st.tot[0]>st.tot[1]?0:1;return`<main class=stage><div class="cd win"><div class=trophy>🏆</div><small>الفائز</small><div class=q>${nm(w)}</div><div class=row>${[0,1].map(t=>`<div class="sc c${t}"><span>${nm(t)}</span><b>${AR(st.tot[t])}</b></div>`).join('')}</div></div><div class=cd><h2>تفاصيل الجولات</h2>${st.res.map((x,i)=>x?`<p>${RN[i]}: ${tg(x.w)} (${E(x.txt)}) +${AR(st.pts[i])}</p>`:'').join('')}${st.fw!=null?`<p>تعادل النقاط وحسمه لغز إضافي لصالح ${tg(st.fw)} دون نقاط إضافية.</p>`:''}</div></main>`}
function hd(){const sc=t=>`<div class="sc c${t}"><span>${nm(t)}</span><b data-s=${t}>${AR(st.tot[t])}</b></div>`;const mid=st.ph==='final'?'النتيجة النهائية':st.g&&st.g.mode==='final'?'لغز الحسم':'الجولة '+AR(st.ri+1)+': '+RN[st.ri];return`<header class=hd>${sc(0)}<div class=rn>${mid}<small>${AR(st.pts[Math.min(st.ri,2)])} نقطة</small></div>${sc(1)}</header>`}
function bar(){if(!HO)return'';const b=(a,l,c)=>`<button class="b ${c||''}" data-a=${a}>${l}</button>`,g=st.g;let x='';
 if(st.ph==='intro')x=b('go','ابدأ الجولة')+(st.ri===0&&!st.res[0]?b('lobby','رجوع للوبي','g'):'');
 else if(st.ph==='rres')x=b('nx',st.ri<2?'الجولة التالية':st.tot[0]===st.tot[1]?'لغز الحسم':'النتيجة النهائية');
 else if(st.ph==='play'&&g){if(g.kind===1)x=g.ph==='in'?b('force','اكشف الآن (بالمتاح)','g'):g.ph==='rev'?(g.show?b('fin','اعتمد النتيجة'):b('show','اكشف للجمهور')):b('next','التالي');
  if(g.kind===2)x=g.ph==='ans'?(!g.exp?(g.T.run?b('pause','إيقاف مؤقت','g'):g.T.left<30000?b('resume','استئناف','t'):b('go2','ابدأ الوقت'))+b('fail','إنهاء المحاولة','r'):b('fin','اعتمد النتيجة')):g.ph==='done'?b('next','التالي'):'';
  if(g.kind===3)x=g.ph==='ready'?b('show','اعرض اللغز'):g.ph==='run'?`<span>الإجابة: ${E(g.answer)}</span>`+(g.T.run?b('pause','إيقاف مؤقت','g'):b('resume','استئناف','t'))+b('skip','إنهاء اللغز','r'):g.ph==='buzz'?`<span>الإجابة: ${E(g.answer)}</span>`+b('ok','صحيحة','t')+b('no','خاطئة','r')+b('skip','إنهاء اللغز','g'):b('next','التالي')+(g.mode==='final'?b('w0','حسم: '+E(st.names[0]),'g')+b('w1','حسم: '+E(st.names[1]),'g'):'')}
 return`<footer class=host><span>المقدم</span>${x}${b('undo','تراجع','g')}${b('aud','إخفاء الأدوات (H)','g')}${b('reset',cf?'اضغط مجدداً للتأكيد':'لعبة جديدة','g')}</footer>`}
function render(){if(st.ph==='lobby'){paint(lobby());return}
 let b;if(st.ph==='intro')b=intro();else if(st.ph==='final')b=final();else if(st.ph==='rres'){const x=st.res[st.ri];b=`<main class=stage><div class="cd pop"><h2>نتيجة الجولة ${AR(st.ri+1)}: ${RN[st.ri]}</h2><div class=q>فاز ${tg(x.w)}</div><p>${E(x.txt)}</p><p><b>+${AR(st.pts[st.ri])}</b> نقطة</p></div></main>`}
 else b=`<main class=stage>${st.g.kind===1?k1():st.g.kind===2?k2():k3()}</main>`;
 paint((st.ph==='final'?'':hd())+b+bar())}
setInterval(()=>{if(!st||!st.g)return;const T=st.g.T,e=$('#tn');if(!e||!T)return;const ms=T.run?Math.max(0,T.dl-(Date.now()+off)):T.left;e.textContent=AR(Math.ceil(ms/1e3));const bb=$('#tbar');if(bb)bb.style.width=ms/300+'%';e.parentElement.classList.toggle('lo',ms>0&&ms<=5e3)},100);
// ---- actions
const val=id=>{const e=document.getElementById(id);return e?e.value.trim():''};
const HH={create,aud:()=>document.body.classList.toggle('aud'),
 add:t=>{const v=val('nn'+t);A('add',{name:v,team:+t}).then(r=>{if(r.ok){const e=$('#nn'+t);if(e)e.value=''}})},
 rename:id=>{const n=prompt('الاسم الجديد',P(id).name);if(n)A('rename',{pid:id,name:n})},
 move:v=>{const[i,t]=v.split(':');A('move',{pid:i,team:+t})},kick:id=>A('kick',{pid:id}),
 pick:v=>{const[t,i]=v.split(':');A('pick',{team:+t,pid:i})},
 ans:id=>A('ans',{pid:id,text:val('a_'+id)}).then(r=>{if(r.ok){const e=document.getElementById('a_'+id);if(e)e.value=''}}),
 ov:id=>A('ov',{pid:id}),bid:t=>A('bid',{team:+t,v:val('bv'+t)}),wd:t=>A('wd',{team:+t}),
 add2:()=>A('add2',{text:val('ai')}).then(r=>{if(r.ok){const e=$('#ai');if(e){e.value='';e.focus()}}}),
 pv:v=>{const[i,o]=v.split(':');A('pv',{i:+i,ok:o==='1'})},hbuzz:t=>A('hbuzz',{team:+t,pid:val('hb'+t)}),
 reset:()=>{if(cf){cf=0;A('reset')}else{cf=1;render();setTimeout(()=>{cf=0;st&&render()},3500)}}};
for(const a of['start','go','lobby','force','show','fin','next','go2','pause','resume','fail','ok','no','skip','w0','w1','nx','undo'])HH[a]=()=>A(a);
document.addEventListener('click',e=>{const b=e.target.closest('[data-a]');if(b&&HO&&HH[b.dataset.a])HH[b.dataset.a](b.dataset.v);else if(b&&b.dataset.a==='aud')HH.aud()});
document.addEventListener('change',e=>{if(e.target.dataset.ch==='names')A('names',{n0:val('t0'),n1:val('t1')})});
addEventListener('keydown',e=>{const t=e.target;if(t.tagName==='INPUT'){if(e.key==='Enter'){if(t.id==='ai')HH.add2();else if(t.id.startsWith('a_'))HH.ans(t.id.slice(2));else if(t.id.startsWith('nn'))HH.add(t.id.slice(2));else if(t.id.startsWith('bv'))HH.bid(t.id.slice(2))}return}if(e.code==='KeyH'&&HO)HH.aud()});
init();
</script></body></html>
