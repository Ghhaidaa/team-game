<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>مسابقة الفرق</title>
<link href="https://fonts.googleapis.com/css2?family=Readex+Pro:wght@500;700&family=Tajawal:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/common.css"><style>
body{font-size:clamp(15px,1.05vw + 3px,22px)}
body.g{height:100vh;height:100dvh;overflow:hidden;background:radial-gradient(circle at 92% -10%,#9E5AFF26,transparent 45%),radial-gradient(circle at 5% 110%,#00DCC526,transparent 40%),var(--bg)}
body[data-r="0"]{--ac:var(--p)}body[data-r="1"]{--ac:var(--t)}body[data-r="2"]{--ac:var(--y)}
#app.shell{height:100%;display:grid;grid-template-rows:auto minmax(0,1fr) auto}
/* header */
.hd{display:grid;grid-template-columns:1fr minmax(150px,24%) 1fr;gap:10px;align-items:center;padding:8px 18px;background:var(--ink);color:#fff;border-bottom:4px solid var(--ac);transition:border-color .4s}
.sc{display:flex;justify-content:space-between;align-items:center;border-radius:10px;padding:2px 14px;min-height:46px}.sc span{font-weight:700;font-size:1.05em}.sc .num{font-size:2em;font-weight:700;line-height:1.1}.num.bump{animation:bump .6s}@keyframes bump{40%{transform:scale(1.35)}}
.rn{text-align:center;line-height:1.25}.rn b{font-size:1.05em}.rn small{display:block;color:var(--y);opacity:1;font-size:.85em}.dots{display:flex;gap:6px;justify-content:center;margin-top:3px}.dots i{width:22px;height:5px;border-radius:3px;background:#ffffff33}.dots i.d{background:var(--ac)}.dots i.n{background:#fff}
/* stage */
.stage{padding:14px 22px;display:flex;flex-direction:column;justify-content:center;align-items:stretch;gap:12px;overflow:auto;max-width:1200px;width:100%;margin:0 auto;text-align:center;min-height:0}
.meta{font-size:.9em;color:var(--mu);display:flex;gap:10px;justify-content:center;align-items:center;flex-wrap:wrap}.meta b{background:var(--ac);color:var(--ink);padding:1px 12px;border-radius:99px;font-size:.95em}body[data-r="0"] .meta b{color:#fff}
.qc{background:#fff;border-radius:14px;padding:14px 22px;border-right:6px solid var(--ac);box-shadow:0 4px 14px rgba(37,20,74,.07);animation:in .45s}@keyframes in{from{transform:translateY(12px);opacity:0}}
.qc .q{margin:0}
.two{display:grid;grid-template-columns:1fr 1fr;gap:14px}.panel{background:#fff;border-radius:14px;padding:10px 12px;box-shadow:0 1px 0 rgba(37,20,74,.12)}.panel h3{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px;font-size:1.05em}
.slot{display:flex;justify-content:space-between;align-items:center;gap:8px;background:var(--bg);border-radius:10px;padding:5px 10px;margin:5px 0;font-weight:700;border:2px solid transparent;text-align:right}.slot.ok{border-color:var(--t)}.slot.no{border-color:var(--rd)}.slot.dup{border-color:var(--y)}.slot .a{font-size:1.2em}.slot small{font-weight:400}.slot.no .a{text-decoration:line-through}button.slot{width:100%;font:inherit;font-weight:700;color:inherit;cursor:pointer}
.verdict{font:700 1.3em 'Readex Pro',sans-serif;margin-top:4px}.verdict.ok{color:#08907f}.verdict.no{color:var(--rd)}
.vs{display:grid;grid-template-columns:1fr auto 1fr;gap:12px;align-items:center}.vs .p{border-radius:12px;padding:6px 12px;font-weight:700}.vs .p small{display:block;opacity:.85}.vs i{font:700 1.2em 'Readex Pro',sans-serif;font-style:normal;color:var(--mu)}
.bidn{font:700 clamp(54px,8vw,120px)/1 'Readex Pro',sans-serif;color:var(--ink)}
.tmr{display:inline-flex;flex-direction:column;align-items:center;gap:3px;min-width:120px}.tmr b{font-size:clamp(34px,4vw,64px);line-height:1;font-variant-numeric:tabular-nums}.tmr i{display:block;width:100%;height:6px;border-radius:4px;background:#25144a1a;overflow:hidden}.tmr u{display:block;height:100%;background:var(--ac);text-decoration:none}.tmr.lo b{color:var(--rd);animation:pl .5s infinite alternate}
.ans{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}.ans .slot{margin:0;display:inline-flex}
.puz{background:#fff;border-radius:16px;padding:clamp(10px,3vh,34px) 20px;box-shadow:0 4px 18px rgba(37,20,74,.08);border-top:6px solid var(--ac)}
.bz{border-radius:14px;padding:10px;animation:pp .4s}.bz .q{margin:0}
.big{font-size:clamp(28px,3.4vw,56px);font-weight:700}
.hero{background:linear-gradient(165deg,#9E5AFF,#25144A);border-radius:0 0 50% 50%/0 0 44px 44px;padding:34px 16px 64px;color:#fff;text-align:center}.hero h1{font-size:clamp(36px,5vw,76px);line-height:1.2}.hero h1 span{color:var(--y)}.hero p{margin:6px 0 16px;opacity:.9}.hero a.b{background:transparent;color:#fff;border:2px solid #fff8}
.pill{display:inline-block;background:#ffffff26;border-radius:99px;padding:3px 14px;font-size:.85em;margin-bottom:10px}
.tabs{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:-22px;position:relative}.tabs span{padding:7px 18px;border-radius:10px;font:700 .95em 'Readex Pro',Tajawal,sans-serif;box-shadow:0 4px 12px #25144a44}.tabs span:nth-child(odd){transform:rotate(-2deg)}.tabs span:nth-child(even){transform:rotate(1.5deg)}
.home{max-width:1000px;margin:0 auto;padding:18px 16px 30px;text-align:center}.home h2{margin:22px 0 10px}.row3{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}@media(max-width:700px){.row3,.two{grid-template-columns:1fr}}
.rc{text-align:right;background:#fff;border-radius:14px;padding:14px}.rc i,.st i{display:inline-grid;place-items:center;width:32px;height:32px;border-radius:50%;font:700 1em 'Readex Pro',Tajawal,sans-serif;font-style:normal;color:var(--ink)}.st i{background:var(--y)}.cta{background:var(--ink);color:#fff;border-radius:18px;padding:22px;margin:22px 0}
/* lobby */
.lobby{display:grid;grid-template-columns:minmax(250px,330px) 1fr;gap:18px;padding:14px 22px;max-width:1200px;margin:0 auto;width:100%;min-height:0;align-items:stretch}@media(max-width:850px){.lobby{grid-template-columns:1fr;overflow:auto}}
.qrcard{text-align:center;background:#fff;border-radius:16px;padding:14px;box-shadow:0 4px 14px rgba(37,20,74,.08);display:flex;flex-direction:column;align-items:center;gap:6px;overflow:auto}
.qrframe{background:#fff;border-radius:14px;padding:4px;border:5px solid var(--p);box-shadow:0 0 0 3px var(--y);animation:ring 2.4s infinite;width:min(100%,clamp(170px,36vh,270px))}.qrframe svg{display:block;width:100%;height:auto}@keyframes ring{50%{box-shadow:0 0 0 7px #FFCA3A66}}
.code{font:700 2.1em/1.1 'Readex Pro',sans-serif;letter-spacing:.14em;direction:ltr;color:var(--p)}.qrcard small{word-break:break-all;font-size:.8em}#warn{color:#c0334d;font-size:.8em}
.tms{display:grid;grid-template-columns:1fr 1fr;gap:14px;min-height:0}.tms>div{border-radius:14px;padding:12px 14px;display:flex;flex-direction:column;min-height:0}.tms h2{font-size:1.15em;margin-bottom:6px}.tms ul{list-style:none;padding:0;margin:0;overflow:auto;flex:1}
.tms li{background:#ffffff33;border-radius:10px;padding:3px 10px;margin:5px 0;font:700 1em Tajawal;display:flex;gap:5px;align-items:center}.tms li em{flex:1;font-style:normal}.tms li button{border:0;border-radius:6px;cursor:pointer;padding:1px 7px;font-size:.85em}.tms .add{display:flex;gap:4px;margin-top:6px}.tms .add input{margin:0;flex:1;width:auto;min-width:0;font-size:.9em;padding:5px 8px}
.top{display:flex;justify-content:space-between;align-items:center;padding:8px 22px;background:linear-gradient(165deg,#9E5AFF,#25144A);color:#fff}.top h1{font-size:1.6em}.top span{color:var(--y)}.top a.b{margin:0}
/* dock */
.dock{background:var(--ink);color:#fff;border-top:3px solid var(--y);padding:6px 14px;position:relative}.dock .r1,.dock .r2{display:flex;gap:4px;flex-wrap:wrap;align-items:center;justify-content:center}.dock .r2{margin-top:4px;padding-top:4px;border-top:1px solid #ffffff22;font-size:.9em}.dock>.r1>span.lb{color:var(--y);font-weight:700;font-size:.8em;margin-inline-end:6px}
.dock .b{margin:2px}.dock input,.dock select{width:130px;padding:3px 8px;font-size:.9em;margin:2px;border-width:1px}.dock .nm{max-width:150px;overflow:hidden;text-overflow:ellipsis}.dock .sp{flex:1}.dock .xs{margin:0 4px;display:inline-flex;align-items:center;gap:2px}
.menu{position:absolute;bottom:100%;left:10px;background:#fff;color:var(--ink);border-radius:12px;padding:6px;box-shadow:0 6px 24px #0005;display:flex;flex-direction:column;min-width:200px;z-index:20}.menu .b{background:var(--bg);margin:2px;text-align:right}.menu .b.r{background:var(--rd)}
.peek{position:absolute;bottom:100%;right:14px;margin-bottom:6px;background:var(--y);color:var(--ink);border-radius:10px;padding:5px 14px;font-weight:700;box-shadow:0 4px 14px #0004;animation:pp .25s}
body.aud .dock{display:none}body.aud .hd{padding-block:6px}.audb{position:fixed;bottom:8px;left:8px;opacity:.25;padding:6px 10px;z-index:30;display:none}.audb:hover{opacity:1}body.aud .audb{display:inline-block}
.fin{animation:pp .7s}.trophy{font-size:3.4em;animation:bob 1.4s infinite alternate;line-height:1.2}@keyframes bob{to{transform:translateY(-8px) rotate(4deg)}}
.hint{font-size:.85em;color:var(--mu)}.chips{display:flex;flex-wrap:wrap;gap:6px;justify-content:center}.chip{padding:5px 12px;border-radius:10px;border:2px solid transparent;font:700 .95em Tajawal;cursor:pointer;background:var(--bg);color:var(--tx)}.chip.on{border-color:var(--y);background:var(--ink);color:#fff}
.rtl-big{font:700 clamp(26px,3vw,48px) 'Readex Pro',sans-serif}
@media(max-height:760px){.stage{gap:8px;padding-block:8px}.qc{padding:10px 18px}}
</style></head><body><div id="app"></div><button class="b audb" data-a=aud>⚙</button><div id="toast" hidden></div>
<script src="/qrcode.js"></script>
<script>
const $=s=>document.querySelector(s),E=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])),AR=n=>String(n).replace(/\d/g,d=>'٠١٢٣٤٥٦٧٨٩'[d]);
const M=location.pathname.startsWith('/s/')?'s':'h',HO=M==='h';let C,K,st=null,off=0,es,bad=0,cf=0,seen=new Set(),pts=[10,20,40],menu=0,full=0,peekT=null,peekOn=0,prevTot=[0,0];
const RN=['سبوركل','تحدي الثلاثين','خمن العبارة'],RI=['🧠','⚡','🧩'];
const INTRO=['يجيب كل لاعب سراً عن السؤال نفسه. يكسب الفريق التحدي إذا كانت إجاباته الثلاث صحيحة ومختلفة. الأكثر فوزاً بالتحديات الثلاثة يفوز بالجولة.','ثلاث مواجهات: لاعب من كل فريق يزايد على عدد الإجابات حتى ينسحب أحدهما. صاحب أعلى مزايدة يجيب خلال ٣٠ ثانية.','خمسة ألغاز بصرية، ٣٠ ثانية لكل لغز. أول فريق يضغط الجرس يجيب، والخطأ ينقل الفرصة للفريق الآخر.'];
const post=(u,b)=>fetch(u,{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify(b)}).then(r=>r.json()).catch(()=>({e:'تعذر الاتصال بالخادم'}));
function toast(m){const e=$('#toast');e.textContent=m;e.hidden=false;clearTimeout(toast.t);toast.t=setTimeout(()=>e.hidden=true,2600)}
const A=(a,x)=>post('/api/host',{c:C,k:K,a,...x}).then(r=>{if(r.e)toast(r.e);return r});
const nm=t=>E(st.names[t]),P=id=>st.players.find(p=>p.id===id)||{name:'؟',manual:1},tg=t=>`<span class="tag c${t}">${nm(t)}</span>`;
function paint(h,shell){const a=document.activeElement,vals={};document.querySelectorAll('#app input[id],#app select[id]').forEach(e=>vals[e.id]=e.value);const aid=a&&a.id,ss=a&&a.selectionStart;
 document.body.classList.toggle('g',!!shell);const ap=$('#app');ap.className=shell?'shell':'';ap.innerHTML=h;for(const id in vals){const e=document.getElementById(id);if(e)e.value=vals[id]}
 if(aid){const e=document.getElementById(aid);if(e){e.focus();try{e.setSelectionRange(ss,ss)}catch(_){}}}}
async function create(){const r=await post('/api/create',{});if(r.e)return toast(r.e);C=r.c;K=r.k;localStorage.hr=JSON.stringify(r);connect()}
async function init(){if(!HO){C=location.pathname.split('/')[2];return connect()}
 try{({c:C,k:K}=JSON.parse(localStorage.hr))}catch(e){}if(C){const r=await fetch('/api/info?c='+C).catch(()=>null);if(r&&r.status===200)return connect()}C=K=null;home()}
function connect(){if(es)es.close();es=new EventSource(`/api/events?c=${C}&role=${HO?'host&k='+K:'screen'}`);
 es.onmessage=e=>{bad=0;document.body.classList.remove('off');st=JSON.parse(e.data);off=st.now-Date.now();render()};
 es.onerror=async()=>{document.body.classList.add('off');if(++bad>2){const r=await fetch('/api/info?c='+C).catch(()=>null);if(r&&r.status===404){es.close();if(HO){localStorage.removeItem('hr');home()}else paint('<div class=home><div class=q>انتهت الجلسة</div></div>')}}}}
function home(){const rc=['var(--t)','var(--y)','var(--p)'];paint(`<section class=hero><div class=pill>فعالية تنافسية · فريقان · ٣ جولات</div><h1>مسابقة <span>الفرق</span></h1><p>اختاروا لاعبيكم، اجمعوا النقاط، وخلّوا الفوز لأذكى فريق.</p><button class="b big" data-a=create>ابدأ اللعبة</button> <a class=b href="#how">كيف تلعب؟</a></section><div class=tabs>${RN.map((n,i)=>`<span style="background:${rc[i]};color:${i==2?'#fff':'var(--ink)'}">${n}</span>`).join('')}</div><main class=home><h2>شرح الجولات</h2><div class=row3>${RN.map((n,i)=>`<div class=rc style="border-top:5px solid ${rc[i]}"><i style="background:${rc[i]}">${AR(i+1)}</i><h3>${n}</h3><small>${AR(pts[i])} نقطة</small><p>${INTRO[i]}</p></div>`).join('')}</div><h2 id=how>كيف تلعبون؟</h2><div class=row3>${['امسحوا الرمز بجوالكم أو أضافكم المقدم يدوياً','اختاروا ٣ لاعبين لكل جولة','تنافسوا واجمعوا النقاط'].map((t,i)=>`<div class=st><i>${AR(i+1)}</i><p>${t}</p></div>`).join('')}</div><div class=cta><h2>جاهزين للتحدي؟</h2><p></p><button class="b t big" data-a=create>ابدأوا الآن</button></div></main>`,0)}
let qrc={};function genQR(u){if(qrc[u])return qrc[u];try{const q=qrcode(0,'M');q.addData(u);q.make();const n=q.getModuleCount(),z=3;let d='';for(let r=0;r<n;r++)for(let c=0;c<n;c++)if(q.isDark(r,c))d+=`M${c+z},${r+z}h1v1h-1z`;return qrc[u]=`<svg viewBox="0 0 ${n+2*z} ${n+2*z}" shape-rendering="crispEdges" role="img" aria-label="QR"><rect width="100%" height="100%" fill="#fff"/><path d="${d}" fill="#25144A"/></svg>`}catch(e){return'<p>تعذر توليد الرمز</p>'}}
// ---------- header
function hd(){const bump=t=>st.tot[t]!==prevTot[t]?' bump':'';const sc=t=>`<div class="sc c${t}"><span>${nm(t)}</span><b class="num${bump(t)}">${AR(st.tot[t])}</b></div>`;
 const fin=st.ph==='final',tie=st.g&&st.g.mode==='final';let mid=fin?'النتيجة النهائية':tie?'لغز الحسم':RI[st.ri]+' '+RN[st.ri];
 let sub=fin?'':AR(st.pts[Math.min(st.ri,2)])+' نقطة';
 const dots=[0,1,2].map(i=>`<i class="${st.res[i]?'d':i===st.ri&&!fin?'n':''}"></i>`).join('');
 return`<header class=hd>${sc(0)}<div class=rn><b>${mid}</b><small>${sub}</small><div class=dots>${dots}</div></div>${sc(1)}</header>`}
// ---------- stages
function lobby(){const u=location.origin+'/j/'+C,loc=/^(localhost|127\.|0\.0\.0\.0|\[::1\]|192\.168\.|10\.)/.test(location.hostname);
 const roster=t=>{const l=st.players.filter(p=>p.team===t);return`<div class="c${t}"><h2>${nm(t)} (${AR(l.length)})</h2><ul>${l.map(p=>{const n=!seen.has(p.id);seen.add(p.id);return`<li class="${n?'pop':''}"><em>${E(p.name)}</em><span title="${p.manual?'أضافه المقدم (بلا جوال)':'متصل بجواله'}">${p.manual?'✋':p.on?'📱':'📵'}</span>${HO?`<button data-a=rename data-v=${p.id}>✎</button><button data-a=move data-v="${p.id}:${1-t}">⇄</button><button data-a=kick data-v=${p.id}>✕</button>`:''}</li>`}).join('')||'<li style="opacity:.7">بانتظار اللاعبين…</li>'}</ul>${HO?`<div class=add><input id=nn${t} placeholder="إضافة لاعب بلا جوال" maxlength=20><button class="b sm" data-a=add data-v=${t}>إضافة</button></div>`:''}</div>`};
 return`<header class=top><h1>مسابقة <span>الفرق</span></h1>${HO?`<a class="b sm" href="/s/${C}" target=_blank rel=noopener>شاشة عرض ثانية</a>`:''}</header><main class=lobby><section class=qrcard><div class=qrframe>${genQR(u)}</div><div class=code>${C}</div><b>امسحوا الرمز للانضمام</b><small dir=ltr>${u}</small>${loc?'<div id=warn>العنوان محلي: لن تفتحه إلا الجوالات على الشبكة نفسها.</div>':''}</section><section class=tms>${roster(0)}${roster(1)}</section></main>`}
function intro(){const ri=st.ri;let sel='';if(ri<2)sel=`<div class=two>${[0,1].map(t=>`<div class=panel><h3>${tg(t)}<small>${ri?'الترتيب = ترتيب المواجهات':'اختاروا ٣ لاعبين'}</small></h3><div class=chips>${st.players.filter(p=>p.team===t).map(p=>{const i=st.sel[ri][t].indexOf(p.id);return HO?`<button class="chip ${i>=0?'on':''}" data-a=pick data-v="${t}:${p.id}">${i>=0&&ri?AR(i+1)+'. ':''}${E(p.name)}</button>`:`<span class="chip ${i>=0?'on':''}">${E(p.name)}</span>`}).join('')}</div></div>`).join('')}</div>`;
 return`<div class="qc pop"><small>الجولة ${AR(ri+1)} · ${AR(st.pts[ri])} نقطة للفائز</small><div class=q>${RI[ri]} ${RN[ri]}</div><p style="margin:4px 0 0">${INTRO[ri]}</p>${ri==2?'<p class=hint style="margin:2px 0 0">يتشاور الفريق كله، والجرس على جوال كل لاعب.</p>':''}</div>${sel}`}
function tmh(T){return T?`<div class=tmr><b id=tn></b><i><u id=tbar></u></i></div>`:''}
function k1(){const g=st.g,hidden=!g.eval||(HO&&g.ph==='rev'&&!g.show);
 const meta=`<div class=meta><b>${g.i<3?'التحدي '+AR(g.i+1)+' من ٣':'الفاصل'}</b>${g.lv}<span>الفوز ${AR(g.wins[0])} - ${AR(g.wins[1])}</span></div><div class=qc><div class=q>${E(g.q)}</div></div>`;
 if(g.ph==='in'||hidden)return meta+`<div class=two>${[0,1].map(t=>`<div class=panel><h3>${tg(t)}<small>${g.ph==='in'?AR(st.sel[0][t].filter(id=>g.subs.includes(id)).length)+' / ٣ أرسلوا':'الإجابات جاهزة'}</small></h3>${st.sel[0][t].map(id=>{const p=P(id),d=g.subs.includes(id)||g.ph!=='in';return`<div class="slot ${d?'ok':''}"><span>${E(p.name)} <small>${p.manual?'✋':'📱'}</small></span><span>${d?'✓':'…'}</span></div>`}).join('')}</div>`).join('')}</div>${g.ph!=='in'?'<div class=hint>الإجابات مخفية حتى يكشفها المقدم</div>':''}`;
 return meta+`${HO&&g.ph==='rev'?'<div class=hint>اضغط على إجابة لتغيير الحكم عليها</div>':''}<div class=two>${g.eval.map((e,t)=>`<div class=panel><h3>${tg(t)}<span class="verdict ${e.pass?'ok':'no'}">${e.pass?'✓ نجح':'✗ لم ينجح'}</span></h3>${e.it.map(x=>{const c=x.dup?'dup':x.ok?'ok':'no',lab=`<span class=a><span class=tx>${E(x.text||'—')}</span> ${x.dup?'(مكررة)':x.ok?'✓':'✗'}</span><small>${E(x.name)}</small>`;return HO&&g.ph==='rev'?`<button class="slot ${c}" data-a=ov data-v=${x.pid}>${lab}</button>`:`<div class="slot ${c}">${lab}</div>`}).join('')}</div>`).join('')}</div>`}
function k2(){const g=st.g,m=g.mp,pn=t=>m[t]?E(m[t].name)+(m[t].manual?' ✋':' 📱'):'؟';
 const head=`<div class=meta><b>المواجهة ${AR(g.i+1)} من ٣</b>${g.lv}<span>الفوز ${AR(g.w[0])} - ${AR(g.w[1])}</span></div><div class=vs><div class="p c0">${pn(0)}<small>${nm(0)}</small></div><i>ضد</i><div class="p c1">${pn(1)}<small>${nm(1)}</small></div></div><div class=qc><div class=q>${E(g.q)}</div></div>`;
 if(g.ph==='bid')return head+`<div><div class=bidn>${g.bid?AR(g.bid):'—'}</div>${g.bt!=null?`<div>أعلى مزايدة: ${tg(g.bt)}</div>`:'<div class=hint>كم إجابة تستطيع؟ زايدوا من جوالاتكم</div>'}</div>`;
 if(g.ph==='ans')return head+`<div><div>${tg(g.at)} ${pn(g.at)} · المطلوب <b>${AR(g.bid)}</b> · الصحيح <b>${AR(g.ans.filter(x=>x.s==='ok').length)}</b></div>${g.T.run||g.T.left<30000?tmh(g.T):'<div class=hint>بانتظار بدء الوقت…</div>'}${g.exp?'<div class=big>انتهت المحاولة</div>':''}</div><div class=ans>${g.ans.map((x,i)=>`<div class="slot ${x.s==='ok'?'ok':x.s==='p'?'dup':'no'}"><span class=a>${E(x.a)}</span> ${x.s==='ok'?'✓':x.s==='d'?'<small>(مكررة)</small>':x.s==='x'?'✗':HO?`<button class="b t sm" data-a=pv data-v=${i}:1>صحيحة</button><button class="b r sm" data-a=pv data-v=${i}:0>خاطئة</button>`:'…'}</div>`).join('')}</div>`;
 return head+`<div class="pop bz ${g.sx?'c1':'c0'}"><div class=q>${g.sx?'نجح التحدي ✓':'لم ينجح التحدي ✗'}</div>فاز بالمواجهة ${nm(g.sx?g.at:1-g.at)}</div>`}
function k3(){const g=st.g,n=g.mode==='reg'?AR(g.i+1)+' من ٥':'فاصل';
 if(g.ph==='ready')return`<div class="qc pop"><small>الألغاز ${AR(g.sc[0])} - ${AR(g.sc[1])}</small><div class=q>${g.mode==='final'?'لغز الحسم':'اللغز '+n}</div><p class=hint style="margin:0">الفريقان جاهزان؟ الجرس على كل جوال</p></div>`;
 let h=`<div class=meta><b>${g.mode==='final'?'لغز الحسم':'اللغز '+n}</b><span>الألغاز ${AR(g.sc[0])} - ${AR(g.sc[1])}</span></div><div class=puz>${g.puz}</div>${g.ph==='run'?tmh(g.T):''}`;
 if(g.ph==='buzz')h+=`<div class="bz c${g.bz}"><div class=q>🔔 ${nm(g.bz)}${g.by?' · '+E(g.by):''}</div><small style="opacity:.9">${g.bm?'سجّلها المقدم يدوياً':'ضغطة مباشرة من الجوال'} · بانتظار الإجابة</small></div>`;
 if(g.ph==='end')h+=`<div class="qc pop"><div class=q>${E(g.answer)}</div><div>${g.who!==null?'النقطة لـ'+tg(g.who):'انتهى اللغز دون نقاط'}</div></div>`;
 return h}
function final(){const w=st.fw!=null?st.fw:st.tot[0]>st.tot[1]?0:1;return`<div class="qc fin" style="border-right-color:var(--y)"><div class=trophy>🏆</div><small>الفائز</small><div class=rtl-big>${nm(w)}</div><div class=two style="margin-top:8px">${[0,1].map(t=>`<div class="sc c${t}"><span>${nm(t)}</span><b class=num>${AR(st.tot[t])}</b></div>`).join('')}</div></div><div class=panel>${st.res.map((x,i)=>x?`<div>${RI[i]} ${RN[i]}: ${tg(x.w)} <small>${E(x.txt)}</small> · +${AR(st.pts[i])}</div>`:'').join('')}${st.fw!=null?`<div class=hint>تعادل النقاط وحسمه لغز إضافي لصالح ${nm(st.fw)} دون نقاط إضافية</div>`:''}</div>`}
function rres(){const x=st.res[st.ri];return`<div class="qc pop"><small>نتيجة الجولة ${AR(st.ri+1)} · ${RN[st.ri]}</small><div class=rtl-big>فاز ${nm(x.w)}</div><div>${E(x.txt)} · <b>+${AR(st.pts[st.ri])}</b> نقطة</div></div>`}
// ---------- dock (host only)
const val=id=>{const e=document.getElementById(id);return e?e.value.trim():''};
function dock(){if(!HO)return'';const b=(a,l,c)=>`<button class="b ${c||''}" data-a=${a}>${l}</button>`,g=st.g;let x='',r2='';
 if(st.ph==='intro')x=b('go','ابدأ الجولة')+(st.ri===0&&!st.res[0]?b('lobby','رجوع للوبي','g'):'');
 else if(st.ph==='rres')x=b('nx',st.ri<2?'الجولة التالية':st.tot[0]===st.tot[1]?'لغز الحسم':'النتيجة النهائية');
 else if(st.ph==='play'&&g){
  if(g.kind===1){x=g.ph==='in'?b('force','اكشف الآن (بالمتاح)','g'):g.ph==='rev'?(g.show?b('fin','اعتمد النتيجة'):b('show','اكشف للجمهور')):b('next','التالي');
   if(g.ph==='in'){const l=[0,1].flatMap(t=>st.sel[0][t]).filter(id=>!g.subs.includes(id)&&(P(id).manual||full));
    r2=l.map(id=>`<span class=xs><span class=nm>${E(P(id).name)}${P(id).manual?' ✋':''}</span><input id=a_${id} class=mask placeholder="إجابته" autocomplete=off><button class="b p sm" data-a=ans data-v=${id}>أرسل</button></span>`).join('')}}
  if(g.kind===2){x=g.ph==='ans'?(!g.exp?(g.T.run?b('pause','إيقاف مؤقت','g'):g.T.left<30000?b('resume','استئناف','t'):b('go2','ابدأ الوقت'))+b('fail','إنهاء المحاولة','r'):b('fin','اعتمد النتيجة')):g.ph==='done'?b('next','التالي'):'';
   if(g.ph==='bid')r2=[0,1].filter(t=>g.mp[t]&&(g.mp[t].manual||full)).map(t=>`<span class=xs><span class="tag c${t}">${E(g.mp[t].name)}</span><input id=bv${t} type=number min=1 max=30 inputmode=numeric placeholder="مزايدة"><button class="b sm ${t?'t':'p'}" data-a=bid data-v=${t}>زايد</button>${g.bt!=null&&g.bt!==t?`<button class="b r sm" data-a=wd data-v=${t}>انسحاب</button>`:''}</span>`).join('');
   if(g.ph==='ans'&&!g.exp&&g.mp[g.at]&&(g.mp[g.at].manual||full))r2=`<span class=xs><span class="tag c${g.at}">${E(g.mp[g.at].name)}</span><input id=ai autocomplete=off placeholder="إجابته ثم Enter"><button class="b p sm" data-a=add2>أضف</button></span>`}
  if(g.kind===3){x=g.ph==='ready'?b('show','اعرض اللغز'):g.ph==='run'?(g.T.run?b('pause','إيقاف مؤقت','g'):b('resume','استئناف','t'))+b('skip','إنهاء اللغز','r'):g.ph==='buzz'?b('ok','صحيحة','t')+b('no','خاطئة','r')+b('skip','إنهاء اللغز','g'):b('next','التالي')+(g.mode==='final'?b('w0','حسم: '+E(st.names[0]),'g')+b('w1','حسم: '+E(st.names[1]),'g'):'');
   if(g.ph==='run')r2=`<small>تسجيل ضغطة يدوية (أقل دقة من الجوال):</small>`+[0,1].map(t=>`<span class=xs><select id=hb${t}>${st.players.filter(p=>p.team===t).map(p=>`<option value=${p.id}>${E(p.name)}${p.manual?' ✋':''}</option>`).join('')}</select><button class="b sm ${t?'t':'p'}" data-a=hbuzz data-v=${t}>🔔 ${nm(t)}</button></span>`).join('')}}
 const pk=g&&g.kind===3&&g.answer&&['run','buzz'].includes(g.ph)?b('peek','👁 الإجابة','g'):'';
 return`<footer class=dock>${peekOn&&g&&g.answer?`<div class=peek>${E(g.answer)}</div>`:''}${menu?`<div class=menu><button class=b data-a=reset>${cf?'اضغط مجدداً للتأكيد':'لعبة جديدة'}</button><button class=b data-a=full2>ملء الشاشة (F)</button><button class=b data-a=fullc>${full?'✓ ':''}تحكم يدوي في لاعبي الجوال</button>${st.ph!=='lobby'?`<a class=b href="/s/${C}" target=_blank rel=noopener>شاشة عرض ثانية</a>`:''}<button class=b data-a=aud>إخفاء الأدوات (H)</button></div>`:''}<div class=r1><span class=lb>المقدم</span>${x}<span class=sp></span>${pk}${b('undo','تراجع','g')}${b('menu','⋯','g')}</div>${r2?`<div class=r2>${r2}</div>`:''}</footer>`}
function lobbyDock(){if(!HO)return'';const n0=st.players.filter(p=>p.team===0).length,n1=st.players.length-n0;return`<footer class=dock>${menu?`<div class=menu><button class=b data-a=reset>${cf?'اضغط مجدداً للتأكيد':'إعادة تعيين'}</button><button class=b data-a=full2>ملء الشاشة (F)</button><button class=b data-a=aud>إخفاء الأدوات (H)</button></div>`:''}<div class=r1><span class=lb>المقدم</span><input id=t0 value="${E(st.names[0])}" data-ch=names title="اسم الفريق الأول"><input id=t1 value="${E(st.names[1])}" data-ch=names title="اسم الفريق الثاني"><button class=b data-a=start>ابدأ المنافسة (${AR(n0)} / ${AR(n1)})</button><span class=sp></span>${`<button class="b g" data-a=menu>⋯</button>`}</div></footer>`}
function render(){let body,top='';
 if(st.ph==='lobby'){paint(lobby()+lobbyDock(),1);document.body.removeAttribute('data-r');prevTot=[...st.tot];return}
 document.body.dataset.r=Math.min(st.ri,2);
 if(st.ph==='intro')body=intro();else if(st.ph==='final')body=final();else if(st.ph==='rres')body=rres();else body=st.g.kind===1?k1():st.g.kind===2?k2():k3();
 paint(hd()+`<main class=stage>${body}</main>`+dock(),1);prevTot=[...st.tot]}
setInterval(()=>{if(!st||!st.g)return;const T=st.g.T,e=$('#tn');if(!e||!T)return;const ms=T.run?Math.max(0,T.dl-(Date.now()+off)):T.left;e.textContent=AR(Math.ceil(ms/1e3));const bb=$('#tbar');if(bb)bb.style.width=Math.min(100,ms/300)+'%';e.closest('.tmr,.tm').classList.toggle('lo',ms>0&&ms<=5e3)},100);
// ---------- actions
const HH={create,aud:()=>document.body.classList.toggle('aud'),menu:()=>{menu=!menu;render()},fullc:()=>{full=!full;render()},
 full2:()=>{document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen&&document.documentElement.requestFullscreen().catch(()=>toast('المتصفح منع ملء الشاشة'))},
 peek:()=>{peekOn=1;clearTimeout(peekT);peekT=setTimeout(()=>{peekOn=0;st&&render()},4000);render()},
 add:t=>{A('add',{name:val('nn'+t),team:+t}).then(r=>{if(r.ok){const e=$('#nn'+t);if(e)e.value=''}})},
 rename:id=>{const n=prompt('الاسم الجديد',P(id).name);if(n)A('rename',{pid:id,name:n})},
 move:v=>{const[i,t]=v.split(':');A('move',{pid:i,team:+t})},kick:id=>A('kick',{pid:id}),
 pick:v=>{const[t,i]=v.split(':');A('pick',{team:+t,pid:i})},
 ans:id=>A('ans',{pid:id,text:val('a_'+id)}).then(r=>{if(r.ok){const e=document.getElementById('a_'+id);if(e)e.value=''}}),
 ov:id=>A('ov',{pid:id}),bid:t=>A('bid',{team:+t,v:val('bv'+t)}),wd:t=>A('wd',{team:+t}),
 add2:()=>A('add2',{text:val('ai')}).then(r=>{if(r.ok){const e=$('#ai');if(e){e.value='';e.focus()}}}),
 pv:v=>{const[i,o]=v.split(':');A('pv',{i:+i,ok:o==='1'})},hbuzz:t=>A('hbuzz',{team:+t,pid:val('hb'+t)}),
 reset:()=>{if(cf){cf=0;menu=0;A('reset')}else{cf=1;render();setTimeout(()=>{cf=0;st&&render()},3500)}}};
for(const a of['start','go','lobby','force','show','fin','next','go2','pause','resume','fail','ok','no','skip','w0','w1','nx','undo'])HH[a]=()=>A(a);
document.addEventListener('click',e=>{const b=e.target.closest('[data-a]');if(!b)return;const a=b.dataset.a;if(a==='aud'||(HO&&HH[a]))HH[a](b.dataset.v)});
document.addEventListener('change',e=>{if(e.target.dataset.ch==='names')A('names',{n0:val('t0'),n1:val('t1')})});
addEventListener('keydown',e=>{const t=e.target;if(t.tagName==='INPUT'||t.tagName==='SELECT'){if(e.key==='Enter'){if(t.id==='ai')HH.add2();else if(t.id.startsWith('a_'))HH.ans(t.id.slice(2));else if(t.id.startsWith('nn'))HH.add(t.id.slice(2));else if(t.id.startsWith('bv'))HH.bid(t.id.slice(2))}return}
 if(!HO)return;if(e.code==='KeyH')HH.aud();if(e.code==='KeyF')HH.full2()});
init();
</script></body></html>
